<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Relational Archive</title>

  <link rel="stylesheet" href="style.css">

  <!-- D3.js library -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
</head>

<body>

  <main id="timeline-shell">
    <div id="year-ruler" aria-label="Timeline years 1900 to 2023"></div>
    <div id="visualization"></div>
    <div id="person-labels" aria-label="People in the archive"></div>
    <div id="filter-status" aria-live="polite" hidden></div>
  </main>

  <div id="photo-preview" role="tooltip" hidden></div>
  <aside id="photo-detail" aria-live="polite" hidden></aside>

  <script src="sketch.js"></script>

</body>

</html>
